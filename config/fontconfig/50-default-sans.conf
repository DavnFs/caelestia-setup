<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Default sans-serif font = the Caelestia shell font, so Qt apps (whose theme asks for "Sans Serif",
       which fontconfig turns into sans-serif) match the shell. Delete this file to go back to Noto Sans. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Google Sans Flex</string></edit>
  </match>
</fontconfig>
